name: パッケージ検証
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: インストール
        run: python -m pip install ".[gateway,test]"
      - name: 動作と禁止条件のテスト
        run: python -m unittest discover -s tests -v
      - name: 配布ファイルのビルド
        run: python -m build
